name: Windows beta
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Check source
        run: node scripts/check-source.mjs
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Install clipboard renderer dependencies (no Electron download)
        working-directory: apps/desktop/vendor/edge-drop
        run: npm ci --ignore-scripts
      - name: Rust unit tests (no desktop or network fixtures)
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      - name: Windows startup provider regression (isolated registry keys)
        shell: pwsh
        run: ./apps/desktop/tests/verify-startup-provider.ps1
      - name: Build installer
        working-directory: apps/desktop
        shell: pwsh
        run: |
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content unsigned-build.json
          npm run tauri build -- --bundles nsis --config unsigned-build.json
      - name: Install headless browser
        working-directory: apps/desktop
        run: npx playwright install chromium
      - name: Silent headless regression tests
        working-directory: apps/desktop
        run: npm run test:release
      - name: Checksums
        shell: pwsh
        run: Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" } | Out-File apps/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: whispera-windows-x64-unsigned
          path: apps/desktop/src-tauri/target/release/bundle/nsis/
          retention-days: 14

name: macOS preview validation
on:
  push:
    branches: [feat/macos-port, main]
  pull_request:
    paths: ['apps/desktop/**', '.github/workflows/macos-preview.yml', 'scripts/verify-macos-bundle.mjs']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified macOS beta packages
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: macos-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    if: github.repository == 'SikJa/Whispera'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: macos-${{ matrix.arch }}
          cache-on-failure: true
      - name: Check source privacy
        working-directory: .
        run: node scripts/check-source.mjs
      - name: Validate preview manifests
        run: node ../../scripts/verify-macos-release.mjs
      - run: npm ci
      - run: npm ci --ignore-scripts
        working-directory: apps/desktop/vendor/edge-drop
      - name: Build the shared interface
        run: npm run build
      - name: Native logic tests (no capture or microphone)
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked -- --test-threads=1
      - name: Install headless WebKit
        run: npx playwright install webkit
      - name: Validate Mac interface in WebKit
        run: |
          WHISPERA_TEST_BROWSER=webkit node verify-macos-ui.mjs
          WHISPERA_TEST_BROWSER=webkit node verify-palette-stability.mjs
      - name: Build ad-hoc signed app and DMG
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npm run tauri build -- --bundles app,dmg --ci
      - name: Verify updater archive against the repository public key
        working-directory: apps/desktop/src-tauri
        run: WHISPERA_VERIFY_ARCHIVE="$PWD/target/release/bundle/macos/Whispera.app.tar.gz" cargo test --locked updates::tests::built_archive_has_a_valid_repository_signature -- --ignored --exact
      - name: Verify bundle, architectures, resources and signatures
        env:
          WHISPERA_SIGNATURE_VERIFIED: '1'
        run: node ../../scripts/verify-macos-bundle.mjs ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: whispera-macos-${{ matrix.arch }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/*.tar.gz*
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.zip
            apps/desktop/src-tauri/target/release/bundle/macos/verification.json
          if-no-files-found: error
  windows-regression:
    if: github.repository == 'SikJa/Whispera'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: npm ci --ignore-scripts
        working-directory: apps/desktop/vendor/edge-drop
      - run: npm run build
      - run: cargo test --locked
        working-directory: apps/desktop/src-tauri
      - run: npx playwright install chromium
      - run: npm run test:release
      - name: Prepare Windows candidate version without publishing
        id: windows-version
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHISPERA_STABLE_BASE: '0.2.28'
        run: node scripts/release-version.mjs
      - name: Build signed Windows candidate installer
        if: steps.windows-version.outputs.skip != 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npm run tauri build -- --bundles nsis --ci
      - name: Verify Windows process identity
        if: steps.windows-version.outputs.skip != 'true'
        shell: pwsh
        run: |
          $identity=(Get-Item -LiteralPath 'src-tauri/target/release/whispera-desktop.exe').VersionInfo
          if($identity.ProductName -ne 'Whispera' -or $identity.FileDescription -ne 'Whispera'){throw 'El ejecutable no se identifica como Whispera'}
          $identity | Select-Object ProductName,FileDescription,ProductVersion | ConvertTo-Json
      - name: Verify Windows updater signature
        if: steps.windows-version.outputs.skip != 'true'
        working-directory: apps/desktop/src-tauri
        shell: pwsh
        run: |
          $installer=@(Get-ChildItem -LiteralPath 'target/release/bundle/nsis' -Filter '*-setup.exe')
          if($installer.Count -ne 1){throw 'Instalador inexistente o ambiguo'}
          $env:WHISPERA_VERIFY_ARCHIVE=$installer[0].FullName
          cargo test --locked updates::tests::built_archive_has_a_valid_repository_signature -- --ignored --exact
      - uses: actions/upload-artifact@v4
        if: steps.windows-version.outputs.skip != 'true'
        with:
          name: whispera-windows-candidate
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe*
            .local/release.json
          if-no-files-found: error
  publish:
    needs: [native, windows-regression]
    if: github.repository == 'SikJa/Whispera' && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish macos]')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: whispera-macos-*
          path: .local/macos-artifacts
      - name: Publish verified DMGs, portable apps and the separate Mac update feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-macos-preview.mjs --artifacts .local/macos-artifacts --source "$GITHUB_SHA" --notes docs/releases/0.3.0-beta.4.md --publish

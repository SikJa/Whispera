name: macOS preview validation
on:
  push:
    branches: [feat/macos-port, main]
  pull_request:
    paths: ['apps/desktop/**', '.github/workflows/macos-preview.yml', 'scripts/verify-macos-bundle.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: macos-${{ matrix.arch }}
          cache-on-failure: true
      - name: Check source privacy
        run: node ../../scripts/check-source.mjs
      - name: Validate preview manifests
        run: node ../../scripts/verify-macos-release.mjs
      - run: npm ci
      - run: npm ci --ignore-scripts
        working-directory: apps/desktop/vendor/edge-drop
      - name: Build the shared interface
        run: npm run build
      - name: Native logic tests (no capture or microphone)
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked -- --test-threads=1
      - name: Build ad-hoc signed app and DMG
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npm run tauri build -- --bundles app,dmg --ci
      - name: Verify updater archive against the repository public key
        working-directory: apps/desktop/src-tauri
        run: WHISPERA_VERIFY_ARCHIVE="$PWD/target/release/bundle/macos/Whispera.app.tar.gz" cargo test --locked updates::tests::built_archive_has_a_valid_repository_signature -- --ignored --exact
      - name: Verify bundle, architectures, resources and signatures
        env:
          WHISPERA_SIGNATURE_VERIFIED: '1'
        run: node ../../scripts/verify-macos-bundle.mjs ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: whispera-macos-${{ matrix.arch }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/*.tar.gz*
            apps/desktop/src-tauri/target/release/bundle/macos/verification.json
          if-no-files-found: error
  windows-regression:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: npm ci --ignore-scripts
        working-directory: apps/desktop/vendor/edge-drop
      - run: npm run build
      - run: cargo test --locked
        working-directory: apps/desktop/src-tauri
      - run: npx playwright install chromium
      - run: npm run test:release

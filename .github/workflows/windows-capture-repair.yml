name: Windows capture repair
on:
  push:
    branches: [fix/capture-copy-20261015, codex/capture-startup-20261015, codex/long-recording-recovery]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Validate source
        run: node scripts/check-source.mjs
      - name: Keep the installed Windows stable version for this local repair
        run: node --input-type=module -e "import {setVersion} from './scripts/release-version.mjs'; setVersion('0.2.32');"
      - run: npm ci
        working-directory: apps/desktop
      - run: npm ci --ignore-scripts
        working-directory: apps/desktop/vendor/edge-drop
      - name: Build repaired executable
        working-directory: apps/desktop
        run: npm run tauri build -- --no-bundle
      - name: Native regression tests without device fixtures
        working-directory: apps/desktop/src-tauri
        run: cargo test --release --locked
      - name: Install headless Chromium
        working-directory: apps/desktop
        run: npx playwright install chromium
      - name: Silent UI and keyboard regressions
        working-directory: apps/desktop
        run: |
          node verify-hotkey-layout.mjs
          npm run test:release
      - name: Record executable checksum
        shell: pwsh
        run: |
          $repairExe = 'apps/desktop/src-tauri/target/release/whispera-desktop.exe'
          [ordered]@{source=$env:GITHUB_SHA;version='0.2.32';sha256=(Get-FileHash -LiteralPath $repairExe -Algorithm SHA256).Hash} | ConvertTo-Json | Out-File -LiteralPath 'apps/desktop/src-tauri/target/release/repair-verification.json' -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: whispera-windows-capture-repair
          path: |
            apps/desktop/src-tauri/target/release/whispera-desktop.exe
            apps/desktop/src-tauri/target/release/repair-verification.json
          if-no-files-found: error
          retention-days: 7

name: Windows beta
on:
  push:
    branches: [main, codex/read-aloud]
  pull_request:
  workflow_dispatch:
concurrency:
  group: windows-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      WHISPERA_LIGHT_CHECKS: ${{ github.head_ref == 'codex/read-aloud' || github.ref_name == 'codex/read-aloud' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true
      - name: Check source
        run: node scripts/check-source.mjs
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Install clipboard renderer dependencies (no Electron download)
        working-directory: apps/desktop/vendor/edge-drop
        run: npm ci --ignore-scripts
      - name: Rust unit tests (no desktop or network fixtures)
        working-directory: apps/desktop/src-tauri
        shell: pwsh
        run: |
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Local reader protocol tests (silent)
        shell: pwsh
        run: node apps/desktop/tests/reader-protocol.mjs apps/desktop/src-tauri/target/reader/WhisperaReader.exe
      - name: Claude quota collector tests (isolated fixtures)
        shell: pwsh
        run: node apps/desktop/tests/ai-usage-collector.mjs apps/desktop/src-tauri/target/reader/WhisperaClaudeUsage.exe
      - name: Reader MP3 export (silent, temporary files)
        shell: pwsh
        run: node apps/desktop/tests/reader-mp3.mjs apps/desktop/src-tauri/target/reader/WhisperaReader.exe apps/desktop/node_modules/ffmpeg-static/ffmpeg.exe
      - name: Windows startup provider regression (isolated registry keys)
        if: env.WHISPERA_LIGHT_CHECKS != 'true'
        shell: pwsh
        run: ./apps/desktop/tests/verify-startup-provider.ps1
      - name: Build installer
        working-directory: apps/desktop
        shell: pwsh
        run: |
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content unsigned-build.json
          npm run tauri build -- --bundles nsis --config unsigned-build.json
      - name: Install headless browser
        working-directory: apps/desktop
        run: npx playwright install chromium
      - name: Silent headless regression tests
        working-directory: apps/desktop
        shell: pwsh
        run: |
          if ($env:WHISPERA_LIGHT_CHECKS -eq 'true') { npm run test:release -- settings-search application settings-layout hotkeys library-settings app-themes }
          else { npm run test:release }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Checksums
        shell: pwsh
        run: Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" } | Out-File apps/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: whispera-ai-usage-preview
          path: .local/ai-usage-preview.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: whispera-windows-x64-unsigned
          path: apps/desktop/src-tauri/target/release/bundle/nsis/
          retention-days: 14
